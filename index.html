<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-модель в дополненной реальности</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87CEEB; /* Голубой фон */
        }
        model-viewer {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <model-viewer 
        src="model.glb" 
        alt="3D модель"
        auto-rotate 
        camera-controls 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        shadow-intensity="1">
    </model-viewer>
</body>

</html>
