<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-модель в AR</title>

    <!-- Дұрыс кітапхана қосу -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #87CEEB;
        }
        model-viewer {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <model-viewer
        src="model.glb"
        alt="3D-модель"
        camera-controls
        auto-rotate
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1">
    </model-viewer>
</body>
</html>
