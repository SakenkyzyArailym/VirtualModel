<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D-модель в дополненной реальности</title>

  <!-- ВАЖНО: подключаем готовый бандл (dist/model-viewer.min.js) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; }
    model-viewer { width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body>
  <!-- 
    src="model.glb" — файл model.glb должен лежать рядом с этим HTML и быть доступен по HTTP.
    ios-src="model.usdz" — если хотите Quick Look на iOS, нужен .usdz файл с этим именем.
  -->
  <model-viewer
    src="model.glb"
    ios-src="model.usdz"
    alt="3D модель"
    auto-rotate
    camera-controls
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="1"
    style="background: transparent;">
  </model-viewer>
</body>
</html>
